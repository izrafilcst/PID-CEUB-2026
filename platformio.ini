[env:native]
platform = native
build_flags = -Wall -Wextra -std=gnu++17 -DUNITY_INCLUDE_FLOAT -DNATIVE_BUILD -I${PROJECT_TEST_DIR}
lib_deps = Unity
test_build_src = yes
test_ignore = test_sensors

; Versões fixas (F-30): espressif32 6.13.0 = arduino-esp32 2.0.17; NimBLE-Arduino >= 2.5.0
; trata char[] em setValue com strnlen (F-22). Os ambientes bench_* herdam daqui.
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
build_flags = -Wall -Wextra -std=gnu++17 -DUNITY_INCLUDE_FLOAT
lib_deps =
    Unity
    h2zero/NimBLE-Arduino@2.5.1
monitor_speed = 115200
upload_speed = 921600

; ── Testes de bancada (examples/) — cada um substitui o main.cpp ──────────────
[bench]
extends = env:esp32dev

[env:bench_motor]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/motor_smoke_test.cpp>

[env:bench_encoder]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/encoder_smoke_test.cpp>

[env:bench_sensor_raw]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/sensor_raw_test.cpp>

[env:bench_sensor_cal]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/sensor_calibration_test.cpp>

[env:bench_velocity_cal]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/velocity_calibration_test.cpp>

[env:bench_differential]
extends = bench
build_src_filter = +<*> -<main.cpp> +<../examples/differential_hw_test.cpp>
